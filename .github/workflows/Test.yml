name: GitHub Actions Test
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Print message
        run: echo "Hello, GoodDay!"
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Verify Java Installation
        run: java -version
      - name: Give execute permission to Maven Wrappper
        run: chmod +x mvnw
#      - name: Build Spring Boot Application
#        run: ./mvnw clean package
      - name: Build, Test and SonarCloud Analysis
        run: |
              ./mvnw clean verify sonar:sonar \
              -Dsonar.projectKey=sumaiyatabasumb_github-actions-demo-repository \
              -Dsonar.organization=sumaiyatabasumb \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.token=${{ secrets.SONAR_TOKEN }}
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: target/*.jar
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/demo-app:1.0